<div class="fullscreen-login-container">
  <!-- Left Side - Decorative -->
  <div class="login-right">
    <div class="decorative-content">
      <div class="brand-content">
        <h2 class="brand-title">Secure Account Recovery</h2>
        <p class="brand-subtitle">We'll help you regain access to your account</p>
        <div class="feature-list">
          <div class="feature-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7V10C2 16 6 20.5 12 22C18 20.5 22 16 22 10V7L12 2Z"/>
            </svg>
            <span>Secure OTP Verification</span>
          </div>
          <div class="feature-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
            </svg>
            <span>Quick Password Reset</span>
          </div>
          <div class="feature-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span>Protected Access</span>
          </div>
        </div>
      </div>
      <div class="decorative-pattern">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
        <div class="shape shape-7"></div>
        <div class="shape shape-8"></div>
      </div>
    </div>
  </div>

  <!-- Right Side - Form -->
  <div class="login-left">
    <div class="login-form-wrapper">
      <!-- Logo -->
      <div class="logo-section">
        <div class="logo-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7V10C2 16 6 20.5 12 22C18 20.5 22 16 22 10V7L12 2Z" stroke="#5B21B6" stroke-width="2" fill="none"/>
          </svg>
        </div>
      </div>

      <!-- Welcome Text -->
      <div class="welcome-section">
        <h1 class="welcome-title">Forgot Password?</h1>
        <p class="welcome-subtitle">Enter your email to receive reset instructions</p>
      </div>

      <!-- Forgot Password Form -->
      <form class="login-form" (ngSubmit)="onSubmit()">
        <!-- Success Message -->
        <div *ngIf="successMessage" class="success-alert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          {{ successMessage }}
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="error-alert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ errorMessage }}
        </div>

        <!-- Email Field -->
        <div class="form-field">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your registered email"
            [(ngModel)]="email" 
            required>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="login-button" [disabled]="isLoading">
          <span *ngIf="!isLoading">Send Reset OTP</span>
          <span *ngIf="isLoading">Sending...</span>
        </button>

        <!-- Back to Login -->
        <div class="register-section">
          <p>Remember your password? <a routerLink="/auth/login">Back to Login</a></p>
        </div>
      </form>
    </div>
  </div>
</div>
