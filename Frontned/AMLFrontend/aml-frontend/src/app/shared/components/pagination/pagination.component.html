<div class="pagination-container" *ngIf="totalItems > 0">
  <div class="pagination-info">
    Showing {{ getStartIndex() + 1 }} to {{ getEndIndex() }} of {{ totalItems }} entries
  </div>
  <div class="pagination-controls">
    <button 
      class="pagination-btn" 
      [disabled]="currentPage === 1" 
      (click)="goToPage(1)"
      title="First page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M11 19l-7-7 7-7m8 14l-7-7 7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button 
      class="pagination-btn" 
      [disabled]="currentPage === 1" 
      (click)="previousPage()"
      title="Previous page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M15 19l-7-7 7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    
    <div class="pagination-pages">
      <button 
        *ngFor="let page of getPageNumbers()" 
        class="pagination-page" 
        [class.active]="page === currentPage"
        (click)="goToPage(page)">
        {{ page }}
      </button>
    </div>
    
    <button 
      class="pagination-btn" 
      [disabled]="currentPage === getTotalPages()" 
      (click)="nextPage()"
      title="Next page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M9 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button 
      class="pagination-btn" 
      [disabled]="currentPage === getTotalPages()" 
      (click)="goToPage(getTotalPages())"
      title="Last page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M13 5l7 7-7 7M5 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div class="pagination-size">
    <label for="pageSize">Show:</label>
    <select id="pageSize" [value]="pageSize" (change)="onPageSizeChange(+$any($event.target).value)">
      <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
    </select>
  </div>
</div>
